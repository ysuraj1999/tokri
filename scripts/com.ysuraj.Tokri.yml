app-id: com.ysuraj.Tokri
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: Tokri
finish-args:
  - --unset-env=GTK3_MODULES
  - --unset-env=SESSION_MANAGER
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --device=input
  - --filesystem=home
  - --talk-name=org.kde.StatusNotifierWatcher
modules:
  - name: Tokri
    buildsystem: cmake-ninja
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .qtcreator
          - build
          - assets
          - docs
          - dist
          - repo
